{% extends "base.html" %}{% block content %}<div class="quiz-shell"><div class="quiz-top"><div><div class="eyebrow">SESSÃO</div><h1 id="progress">Questão 1 de {{questions|length}}</h1></div><div class="score" id="score">0 acertos</div></div>
<div class="card question-card"><div class="qmeta" id="meta"></div><div class="statement" id="statement"></div><div class="confidence"><span>Confiança:</span><label><input type="radio" name="conf" value="Certeza" checked> Certeza</label><label><input type="radio" name="conf" value="Dúvida"> Dúvida</label><label><input type="radio" name="conf" value="Chute"> Chute</label></div>
<div class="answer-buttons"><button id="certo" class="answer">CERTO</button><button id="errado" class="answer">ERRADO</button></div><div class="qactions"><span id="timer">0s</span></div><div id="feedback" class="feedback hidden"></div><button id="next" class="btn primary hidden">Próxima →</button></div></div>{% endblock %}
{% block scripts %}<script>const Q={{questions|tojson}},mode={{mode|tojson}},examId={{exam_id}};let i=0,correct=0,start=Date.now(),sessionStart=Date.now(),answered=false;const el=id=>document.getElementById(id);
function show(){answered=false;start=Date.now();let q=Q[i];el('progress').innerText=`Questão ${i+1} de ${Q.length}`;el('score').innerText=`${correct} acertos`;el('meta').innerText=`${q.subject_name||q.topic||'Sem tema'} • ${q.difficulty||'—'} • página ${q.page||'—'}`;el('statement').innerText=q.statement;el('feedback').classList.add('hidden');el('next').classList.add('hidden');el('certo').disabled=false;el('errado').disabled=false;}
setInterval(()=>{if(!answered)el('timer').innerText=Math.round((Date.now()-start)/1000)+'s'},500);
async function ans(choice){if(answered)return;answered=true;let conf=document.querySelector('input[name=conf]:checked').value,seconds=(Date.now()-start)/1000,q=Q[i];let r=await fetch('/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({qid:q.db_id,choice,confidence:conf,seconds,mode})});let d=await r.json();if(d.correct)correct++;el('score').innerText=`${correct} acertos`;el('feedback').innerHTML=`<b class="${d.correct?'good':'bad'}">${d.correct?'✓ ACERTOU':'✕ ERROU'}</b><h3>Gabarito: ${d.answer}</h3><p>${d.explanation}</p><div class="basis"><b>Fundamento:</b> ${d.basis} • página ${d.page||'—'}</div>`;el('feedback').classList.remove('hidden');el('next').classList.remove('hidden');el('certo').disabled=true;el('errado').disabled=true;}
el('certo').onclick=()=>ans('Certo');el('errado').onclick=()=>ans('Errado');el('next').onclick=async()=>{if(i+1<Q.length){i++;show()}else{await fetch('/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({exam_id:examId,mode,total:Q.length,correct,duration:(Date.now()-sessionStart)/1000})});location.href=`/exam/${examId}`;}};show();</script>{% endblock %}
